<!DOCTYPE html>  
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Anagrafica Utenti</title>
  <link rel="stylesheet" href="Anagrafica1_1.css">
</head>

<body>
<h2>Anagrafica Utenti</h2>

<input type="text" id="lettera" placeholder="Lettera iniziale">
<button onclick="filtra()">Filtra</button>
<button onclick="maggiorenni()">Maggiorenni</button>

<br><br>

<input type="number" id="annoInput" placeholder="Inserisci anno">
<button onclick="mostraGenerazione()">Generazione</button>
<p id="gen"></p>

<table>
<thead>
<tr><th>Nome</th><th>Cognome</th><th>Anno</th><th>Generazione</th></tr>
</thead>
<tbody id="demo"></tbody>
</table>

<script>
var elencoUtenti = [];

var richiestaDati = new XMLHttpRequest(); 
richiestaDati.open("GET", "anagrafica.json");
richiestaDati.onload = function() {
  elencoUtenti = JSON.parse(richiestaDati.responseText);
  visualizza(elencoUtenti);
};
richiestaDati.send();

function calcolaGenerazione(annoNascita) {
  if (annoNascita >= 2013) return "Alpha";
  else if (annoNascita >= 1997) return "Z";
  else if (annoNascita >= 1981) return "Millennials";
  else if (annoNascita >= 1965) return "X";
  else if (annoNascita >= 1946) return "Boomers";
  else if (annoNascita >= 1923) return "Silent Generation";
  else return "Altro";
}

function visualizza(listaPersone) {
  var righeTabella = "";
  for (var indice = 0; indice < listaPersone.length; indice++) {
    righeTabella += "<tr><td>" + listaPersone[indice].nome + "</td><td>" +
                    listaPersone[indice].cognome + "</td><td>" +
                    listaPersone[indice].anno + "</td><td>" +
                    calcolaGenerazione(listaPersone[indice].anno) + "</td></tr>";
  }
  document.getElementById("demo").innerHTML = righeTabella;
}

function filtra() {
  var letteraIniziale = document.getElementById("lettera").value;
  var utentiFiltrati = [];
  for (var i = 0; i < elencoUtenti.length; i++) {
    var inizialeCognome = elencoUtenti[i].cognome[0];
    if (inizialeCognome == letteraIniziale) {
      utentiFiltrati.push(elencoUtenti[i]);
    }
  }
  visualizza(utentiFiltrati);
}

function mostraGenerazione() {
  var annoInserito = document.getElementById("annoInput").value;
  if (annoInserito == "") return;
  document.getElementById("gen").innerText = "Appartiene a: " + calcolaGenerazione(annoInserito);
}

function maggiorenni() {
  var utentiMaggiorenni = [];
  const dataCorrente = new Date();
  for (var i = 0; i < elencoUtenti.length; i++) {
    if (dataCorrente.getFullYear() - elencoUtenti[i].anno >= 18) {
      utentiMaggiorenni.push(elencoUtenti[i]);
    }
  }
  visualizza(utentiMaggiorenni);
}
</script>

</body>
</html>
